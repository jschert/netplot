[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "netplot"
version = "0.1.6"
description = "PingPlotter-style network latency and packet-loss dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "jschert" }]
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1,<0.29",
    # Security floor for HTTPX's TLS trust store.
    "certifi>=2026.11.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.16.2",
    "pytest-cov>=7.1",
    # Pinned: lint and type-check results change between tool versions.
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[project.scripts]
netplot = "netplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the dashboard assets (index.html, app.js, style.css) inside the wheel
# and sdisk. Without this entry a ``pip install netplot`` would install a
# package whose ``netplot/static/`` directory is missing on disk and the
# dashboard would 500 on ``GET /``.
[tool.setuptools.package-data]
netplot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch the network or spawn subprocesses",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]

[tool.ruff.lint]
ignore = [
    # Settings validation raises ValueError for wrong-typed input, so the API
    # answers 422 for every invalid value instead of 500.
    "TRY004",
]

[tool.mypy]
files = ["src/netplot"]
# Check against the oldest supported interpreter, not the one running mypy.
python_version = "3.11"
