[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "netplot"
version = "0.1.5"
description = "Network plotting and visualization tools"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "jschert" }]
dependencies = [
    "fastapi>=0.114",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28.1,<0.29",
    # Security floor for HTTPX's TLS trust store.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.12.0",
]

[project.scripts]
netplot = "netplot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the dashboard assets (index.html, app.js, style.css) inside the wheel
# and sdisk. Without this entry a ``pip install netplot`` would install a
# package whose ``netplot/static/`` directory is missing on disk and the
# dashboard would 500 on ``GET /``.
[tool.setuptools.package-data]
netplot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that touch the network or spawn subprocesses",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]
