# Routine dependency updates. Vulnerability alerts and CodeQL are repository
# settings; this file only schedules version-bump pull requests. Each
# ecosystem opens at most one grouped PR per week.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
